# =============================================================================
# CONTROL-ROOM PC (CMS + RPF) - hosts, ports and database names used by the start scripts.
# Edit this file, not the scripts. Format: KEY=value (one per line, no spaces around '=').
# An environment variable of the same name, set when you run a script, overrides the value here for that run.
# (Per-installation secrets and the values the dashboards use at run time live in RPF_CMS/rpf/.env and RPF_CMS/CMS/backend/.env.)
# =============================================================================

# How the scripts reach services running on THIS PC (health checks, "is the port busy" tests).
LOOPBACK_HOST=127.0.0.1

# The PostgreSQL server of the CMS database (this PC unless you moved it) and the PostgreSQL superuser used to create it.
DB_HOST=localhost
DB_PORT=5432
DB_NAME=cms
DB_USER=cms
DB_ADMIN_USER=postgres

# Host names/addresses that mean "this very PC" (a database at one of these is treated as local: the scripts may create it).
LOCAL_HOST_NAMES=localhost 127.0.0.1 ::1

# Ports of the two web services. They are FIXED: the scripts never pick "the next free port". A leftover copy of this project on the port is
# stopped; any other program on it stops the start with a message naming that program. Change them here only.
CMS_PORT=7080
RPF_PORT=7090
# Ports that belong to the M-NVR (a train PC): never used for CMS/RPF even if an old .env says so.
RESERVED_PORTS=8080 8090

# Which of this PC's addresses is shown/used for the train PC to reach it.
#   PREFERRED_NETWORK_PREFIX  an address starting with this is chosen first, e.g. "10.20.30." (leave empty = no preference)
#   SKIP_NETWORK_PREFIXES     addresses starting with any of these (space separated) are never guessed
PREFERRED_NETWORK_PREFIX=
SKIP_NETWORK_PREFIXES=192.168. 172.17. 172.18. 127. 169.254.

# Which train networks may connect (database access and, when ufw is in use, the ports). Done by start.sh itself on every start.
#   auto        the network of THIS PC's own address (found from its IP), so every train in this network is allowed
#   <network/bits> ...   exactly these networks, space separated        none   open nothing
# MANAGE_FIREWALL: auto = add ufw rules when ufw is active, yes = always, no = never touch the firewall.
ALLOW_TRAIN_NETWORKS=auto
MANAGE_FIREWALL=auto

# Demo mode only (bash scripts/start.sh demo): which simulated M-NVR units to run.
SIM_UNITS=1,2,3
