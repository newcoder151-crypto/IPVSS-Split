# =============================================================================
# E-MAIL + SMS FOR ALERTS  (read by start.sh when CMS starts; after any change run:  bash start.sh restart)
#
# Alerts, incidents (and, if you switch them on, request / footage / evidence notices) are shown in the RPF dashboard as before.
# With this file filled in they are ALSO sent as e-mail and/or SMS to
#     - the alert e-mail / alert mobile of the RPF post that receives the alert (CMS console -> Registry -> Edit post), and
#     - the control-room recipients you list in the CMS console -> Settings (optional).
# You do NOT have to edit this file: everything here can be entered on the CMS console page Administration -> E-mail & SMS (providers, keys,
# who receives what, rules, test button). A value saved on that page wins over this file; this file is the default (and where the gateway addresses are).
#
# Rules of this file:  KEY=value, one per line, no quotes needed, comments on their OWN line (a # inside a value is part of the value).
# This file holds passwords and API keys: keep it private (start.sh sets it to owner-only). It is read only on this PC and never shown in the console.
# Sending needs a network path to the provider (internet). While there is none, messages wait and are sent when it returns -
# but a message older than NOTIFY_MAX_AGE_MIN is dropped instead of arriving late. The in-app alerts never depend on any of this.
# =============================================================================

# ---------------------------------------------------------------------------
# E-MAIL  (any provider that gives you an SMTP login)
# ---------------------------------------------------------------------------
# smtp = send e-mail      none = off
EMAIL_PROVIDER=none
# starttls (port 587, the usual)  |  ssl (port 465)  |  none (no encryption - only for a trusted local mail server)
SMTP_SECURE=starttls
# Fill these 5 from your provider. Examples:
#   Brevo  (free: 300 e-mails/day, no expiry) : host smtp-relay.brevo.com  port 587  user = your Brevo login e-mail  password = the "SMTP key" (Brevo -> SMTP & API)
#   Gmail  (free)                             : host smtp.gmail.com  port 587  user = your Gmail address  password = an "App password" (Google account -> Security -> 2-step verification -> App passwords)
# The sender address (EMAIL_FROM) must be one the provider accepts (Brevo: a sender you verified; Gmail: the Gmail address itself).
SMTP_HOST=
SMTP_PORT=
SMTP_USER=
SMTP_PASSWORD=
EMAIL_FROM=

# ---------------------------------------------------------------------------
# SMS
# ---------------------------------------------------------------------------
# fast2sms (India)  |  twilio (worldwide)  |  none = off
SMS_PROVIDER=none
# Country code added to numbers written without one (91 = India). A number written +<code><number> always keeps its own code.
SMS_DEFAULT_COUNTRY_CODE=91
# Longest SMS text in characters (longer text is shortened with ...)
SMS_MAX_CHARS=300

# --- Fast2SMS (https://www.fast2sms.com) : Indian numbers only. Free credit on sign-up (a small recharge is needed afterwards).
# API key: Fast2SMS panel -> Dev API.
#   FAST2SMS_ROUTE=q    "Quick SMS": free text, no DLT registration (fine for internal alerts; costs a bit more per SMS)
#   FAST2SMS_ROUTE=dlt  your DLT-approved template: also fill FAST2SMS_SENDER_ID and FAST2SMS_DLT_TEMPLATE_ID
#                       (the template must have ONE variable; the alert text is put into it)
FAST2SMS_API_URL=https://www.fast2sms.com/dev/bulkV2
FAST2SMS_API_KEY=
FAST2SMS_ROUTE=q
FAST2SMS_SENDER_ID=
FAST2SMS_DLT_TEMPLATE_ID=

# --- Twilio (https://www.twilio.com) : Account SID + Auth Token from the Twilio console.
# A FREE TRIAL can text only phone numbers you have verified in the Twilio console (up to 5) and adds "Sent from a Twilio trial account".
# Use TWILIO_FROM (your Twilio number, +1...) or a TWILIO_MESSAGING_SERVICE_SID.
TWILIO_API_URL=https://api.twilio.com/2010-04-01
TWILIO_ACCOUNT_SID=
TWILIO_AUTH_TOKEN=
TWILIO_FROM=
TWILIO_MESSAGING_SERVICE_SID=

# ---------------------------------------------------------------------------
# RULES (defaults; once saved on the console page E-mail & SMS, the console value wins)
# ---------------------------------------------------------------------------
# 1 = on, 0 = off
NOTIFY_EMAIL_ENABLED=0
NOTIFY_SMS_ENABLED=0
# Which notices go out by e-mail / SMS: any of alert, incident, request, footage, evidence
NOTIFY_KINDS=alert,incident
# Alerts below this priority (1-10) are e-mailed but not texted
NOTIFY_SMS_MIN_PRIORITY=1
# Control-room people who get a copy of EVERY outgoing message (comma separated, optional)
NOTIFY_EXTRA_EMAILS=
NOTIFY_EXTRA_PHONES=

# ---------------------------------------------------------------------------
# DELIVERY
# ---------------------------------------------------------------------------
# Give up on one gateway call after this many seconds
NOTIFY_TIMEOUT_S=15
# Attempts per message, and the wait before attempt 2 (doubles each time, max 15 minutes)
NOTIFY_RETRY_MAX=6
NOTIFY_RETRY_BASE_S=20
# Messages older than this many minutes are dropped instead of being sent late
NOTIFY_MAX_AGE_MIN=120
# Keep the delivery log (CMS console -> Settings) this many days
NOTIFY_LOG_DAYS=90
# Link printed at the end of e-mails. Leave empty: start.sh uses this PC's address and the RPF port from control-room.conf
NOTIFY_RPF_URL=
