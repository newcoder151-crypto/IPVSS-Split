# =============================================================================
# TRAIN PC (M-NVR + bridge) - hosts, ports and database names used by the start scripts.
# Edit this file, not the scripts. Format: KEY=value (one per line, no spaces around '=').
# An environment variable of the same name, set when you run a script, overrides the value here for that run.
# Where the control room is (its address) is NOT here: run  bash start.sh --cms <control-room-address>  once; it is kept in data/train.conf.
# =============================================================================

# How the scripts reach services running on THIS PC (health checks).
LOOPBACK_HOST=127.0.0.1
# The address the AI sidecar listens on (all addresses of this PC).
BIND_HOST=0.0.0.0

# This M-NVR's own PostgreSQL database.
DB_HOST=localhost
DB_PORT=5432
MNVR_DB_NAME=mnvr
MNVR_DB_USER=mnvr
DB_ADMIN_USER=postgres

# The control room (CMS): its web port and its PostgreSQL port / database / user (the bridge registers itself there once).
CMS_PORT=7080
CMS_DB_PORT=5432
CMS_DB_NAME=cms
CMS_DB_USER=cms
CMS_DB_PASSWORD=cms

# M-NVR services on this PC.
MNVR_API_PORT=3001
MNVR_UI_PORT=8080
MEDIAMTX_API_PORT=9997
MEDIAMTX_RTSP_PORT=8554
MEDIAMTX_WEBRTC_PORT=8889
MEDIAMTX_HLS_PORT=8888
AI_SIDECAR_PORT=8000

# The bridge's local status page (curl http://<LOOPBACK_HOST>:<BRIDGE_STATUS_PORT>/health).
BRIDGE_STATUS_PORT=8095

# Identity of this M-NVR in the recorded files  <TRAIN>_M<nn>_C<nn>_<start>_<end>.mp4
#   TRAIN_NO  the train this unit rides on (all M-NVRs of one train use the same train number). Empty = read from the M-NVR's own settings.
#   MNVR_NO   this unit's number inside the train (1..99); every M-NVR of a train needs a different one. Empty = CMS numbers it.
TRAIN_NO=
MNVR_NO=

# Which of this PC's addresses is shown in messages (see control-room.conf for the meaning).
PREFERRED_NETWORK_PREFIX=
SKIP_NETWORK_PREFIXES=192.168. 172.17. 172.18. 127. 169.254.

# M-NVR database password and the first-run defaults written to backend/api/.env (an existing .env is never overwritten).
# MediaMTX and the web page BIND to the ports in their own files (mediamtx.yml, frontend/vite.config); the ports above must match them -
# the scripts use these values to reach the services, to check them and to write .env.
MNVR_DB_PASSWORD=mnvr
